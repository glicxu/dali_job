name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DALI_COMMON_LIB_REF: "4902676ece7dde023562f35272054146fbc28e74"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements-runtime.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Audit production Node dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff bandit
      - name: Lint server and scripts
        run: ruff check server scripts
      - name: Run targeted Python security checks
        run: bandit -r server/app -q -ll

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: glicxu/DaliCommonLib
          ref: ${{ env.DALI_COMMON_LIB_REF }}
          token: ${{ secrets.DALI_COMMON_LIB_TOKEN }}
          path: DaliCommonLib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./DaliCommonLib -r requirements-test.txt
      - name: Run server tests
        working-directory: server
        run: pytest

  server-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install alembic
      - name: Validate linear migration history
        run: python scripts/verify_migration_history.py

  client-lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: python -m pip install alembic cyclonedx-bom
      - name: Generate release metadata
        run: python scripts/create_release_manifest.py --output release/release-manifest.json
      - name: Generate release SBOMs
        run: |
          cyclonedx-py requirements requirements-runtime.txt --output-file release/python-sbom.json
          cd client
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --package-lock-only --ignore-npm-errors --output-reproducible --output-file ../release/node-sbom.json
      - name: Package versioned release
        run: python scripts/create_release_bundle.py --output release/dalijob-${{ github.sha }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dalijob-release-${{ github.sha }}
          path: release/
          retention-days: 30

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: glicxu/DaliCommonLib
          ref: ${{ env.DALI_COMMON_LIB_REF }}
          token: ${{ secrets.DALI_COMMON_LIB_TOKEN }}
          path: DaliCommonLib
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./DaliCommonLib -r requirements-test.txt
      - name: Verify OpenAPI contract
        run: |
          python scripts/export_openapi.py --output docs/openapi.json
          git diff --exit-code -- docs/openapi.json
