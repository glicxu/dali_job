; Copy this file to server/config.ini for local development.
; Keep secrets out of this file. Put DALIJOB_SMTP_PASSWORD, OPENAI_API_KEY, and APIFY_API_TOKEN in server/.env.

[dali_job]
env = local
host = 127.0.0.1
port = 5010
log_level = debug
client_origins = http://localhost:3000,http://127.0.0.1:3000
public_client_url = http://127.0.0.1:3000
; Use "local" for normal DaliJob register/login.
; Use "dev" only for no-token local debugging.
auth_mode = local

[mysql]
user = root
passwd = replace_with_local_password
active_server = localhost
active_db_schema = jobs
port = 3306
pool_size = 5
pool_max_overflow = 10
pool_timeout = 30

[dali_job_auth]
; Sessions are opaque, revocable database records. Cookies are HttpOnly and Secure in production.
session_idle_seconds = 43200
session_absolute_seconds = 604800
mobile_access_token_seconds = 900
mobile_refresh_token_seconds = 2592000
email_action_ttl_seconds = 3600

[smtp]
; Import the shared Dalifin common config in deployed environments instead of duplicating these values.
; Without smtp_server and sender_email, local email is written to server/storage/email_outbox.
smtp_server =
port = 587
sender_email =
login =
password =
use_tls = true

[logging]
; Rotating structured API and alert logs. This directory is ignored by git.
directory = ./logs
max_bytes = 10485760
backup_count = 5

[audit]
; The audit_events schema exists; event recording is intentionally future work.
retention_days = 365

[documents]
; Local development file storage. This folder is ignored by git.
storage_dir = ./storage/documents

[openai]
model = gpt-4.1-mini

[ask_scout]
; Ask Scout can use a lower-cost model independently of other AI workflows.
model = gpt-5.6-luna

[provider_limits]
; In-process limits for OpenAI, Apify, and rendered web extraction calls.
user_per_minute = 20
ip_per_minute = 60

[auth_limits]
; Process-local abuse protection for the current single-instance deployment.
login_ip = 30
login_account = 10
login_window_seconds = 300
register_ip = 10
register_account = 5
register_window_seconds = 3600
